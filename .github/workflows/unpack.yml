name: Unpack uploaded site package
on:
  push:
    paths:
      - 'ai-trading-room.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip package into the repository and remove the zip
        run: |
          test -f ai-trading-room.zip || exit 0
          unzip -o -q ai-trading-room.zip -d /tmp/pkg
          cp -r /tmp/pkg/ai-trading-room/. .
          git rm -q --cached ai-trading-room.zip
          rm -f ai-trading-room.zip
          git config user.name "AI Trading Room"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish AI Trading Room research package"
          git push
