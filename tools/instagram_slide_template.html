<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;background:#0b1220;color:#eef2f7;font-family:"DejaVu Sans",sans-serif;position:relative;overflow:hidden}
.brand{position:absolute;top:64px;left:80px;font-weight:700;letter-spacing:6px;color:#e2b04a;font-size:30px}
.num{position:absolute;top:58px;right:80px;font-size:30px;color:#8a96a8}
.box{position:absolute;left:80px;right:80px;top:200px}
h1{font-size:92px;line-height:1.05;font-weight:800}
h1 span{color:#e2b04a}
.sub{font-size:40px;color:#a9b4c4;margin-top:40px;line-height:1.35}
ul{list-style:none;margin-top:30px}li{font-size:44px;line-height:1.3;margin:34px 0;padding-left:64px;position:relative}
li:before{content:"";position:absolute;left:0;top:14px;width:30px;height:30px;border-radius:6px;background:#e2b04a}
li small{display:block;font-size:32px;color:#a9b4c4;margin-top:8px}
.foot{position:absolute;bottom:64px;left:80px;right:80px;font-size:26px;color:#7d889a;line-height:1.4;border-top:2px solid #1f2a3d;padding-top:28px}
.chart{position:absolute;left:80px;right:80px;bottom:230px;height:360px}
.pill{display:inline-block;border:2px solid #e2b04a;color:#e2b04a;border-radius:999px;padding:10px 28px;font-size:30px;margin-bottom:40px}
</style></head><body>
<div class="brand">AI TRADING ROOM</div><div class="num" id="n"></div>
<div class="box" id="c"></div>
<div class="foot">Research &amp; education only — not financial advice. Free &amp; open source.</div>
<script>
const s=new URLSearchParams(location.search).get('s');
const n=document.getElementById('n'),c=document.getElementById('c');
n.textContent=s+' / 3';
if(s==='1'){c.innerHTML=`<div class="pill">POST #1 · FREE INDICATOR</div><h1>Market structure<br>without the <span>noise</span>.</h1><p class="sub">SMC Minimal v2 for TradingView — strict BOS &amp; CHoCH, session lines and a daily volume profile in one script.</p>`;
c.insertAdjacentHTML('afterend',`<svg class="chart" viewBox="0 0 920 360"><polyline fill="none" stroke="#3a4a66" stroke-width="4" points="0,300 90,220 150,260 250,140 320,190 430,70 500,130 560,110 640,250 700,200 790,320 920,240"/><line x1="320" y1="190" x2="700" y2="190" stroke="#e2b04a" stroke-width="4" stroke-dasharray="14 10"/><text x="600" y="178" fill="#e2b04a" font-size="30" font-family="DejaVu Sans">CHoCH</text><circle cx="640" cy="250" r="10" fill="#e2b04a"/></svg>`);}
if(s==='2'){c.innerHTML=`<h1 style="font-size:72px">What it does</h1><ul>
<li>Ignores internal swings<small>Only breaks of the leg's extremes count.</small></li>
<li>Protected level = start of the leg<small>CHoCH only on a candle close beyond it.</small></li>
<li>London &amp; New York opens<small>Plus next-session lines drawn ahead.</small></li>
<li>Daily POC · VAH · VAL<small>A fixed-range profile on each of the last 50–100 days, joined day to day.</small></li></ul>`;}
if(s==='3'){c.innerHTML=`<h1 style="font-size:80px">Get it <span>free</span>.</h1><p class="sub">Full code and explanation on our GitHub:</p><p class="sub" style="color:#eef2f7;font-size:44px;margin-top:20px">github.com/Aitradingroom/<br>ai-trading-room</p><p class="sub" style="margin-top:70px">Next post: the “Shadow” grid robot — why a smooth balance curve can hide a disaster.</p><p class="sub" style="margin-top:50px;color:#e2b04a">Follow so you don't miss it.</p>`;}
</script></body></html>
